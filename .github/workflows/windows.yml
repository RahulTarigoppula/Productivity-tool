name: Windows build

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

# Read-only everywhere; only the release job (v* tags) may write, and it runs no build steps.
permissions:
  contents: read

# A newer push replaces a run still in progress (tag builds always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --release

      - name: Cache Office pack sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/.cache/office
          key: office-pack-${{ hashFiles('apps/desktop/scripts/build-office-pack.mjs') }}

      - name: Build the Office pack (pinned, integrity-checked)
        run: node scripts/build-office-pack.mjs

      - name: Build installer and app (with the Office pack)
        run: pnpm tauri build --config src-tauri/tauri.office.conf.json

      - name: Smoke test the built app on Windows (real WebView2)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item tests/corpus/* $dir
          $env:PRODUCTIVITY_SELF_TEST = $dir
          $p = Start-Process -FilePath "src-tauri/target/release/productivity.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; throw "The app did not finish its self-test within 3 minutes" }
          $report = Join-Path $dir "selftest-report.json"
          if (-not (Test-Path $report)) { throw "No self-test report was written" }
          Get-Content $report
          Copy-Item $report selftest-report.json
          $r = Get-Content $report | ConvertFrom-Json
          if ($r.passed -ne $r.total) { throw "Self-test: $($r.passed) of $($r.total) checks passed" }

      - name: Collect outputs
        shell: pwsh
        run: |
          $out = "release-files"
          New-Item -ItemType Directory -Force $out | Out-Null
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "$out/Productivity_${ver}_x64-setup.exe"
          Copy-Item "src-tauri/target/release/productivity.exe" "$out/Productivity_${ver}_x64-portable.exe"
          Get-ChildItem $out | Format-Table Name, Length
          # Checksums let you confirm a download is the file this build produced.
          Get-ChildItem $out -Filter *.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productivity-windows
          path: |
            apps/desktop/release-files/*
            apps/desktop/selftest-report.json


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: productivity-windows
          path: dl
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dl/release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Cache Office pack sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/.cache/office
          key: office-pack-${{ hashFiles('apps/desktop/scripts/build-office-pack.mjs') }}
      - name: Build the Office pack
        run: node scripts/build-office-pack.mjs
      - name: End-to-end flows (app and Office editing)
        run: |
          pnpm preview --port 1420 --strictPort &
          node tests/office-server.mjs &
          sleep 3
          APP_URL=http://localhost:1420/ pnpm e2e
          pnpm e2e:office
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/desktop/test-results/
